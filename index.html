<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>修飾痕(測試)</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main id="game">
        <div id="app"></div>
        <div id="debug"></div>
    </main>
	<div class="ending">

	  <p>
		故事到此結束……

		謝謝你的遊玩。
	  </p>

	  <button
		class="ending-restart"
		onclick="location.reload()">
		重新開始
	  </button>

	  <div class="ending-links">

		<a
		  class="ending-link"
		  href="你的噗浪網址"
		  target="_blank"
		  rel="noopener">
		  <img src="assets/icon/plurk.png" alt="作者噗浪">
		</a>

		<a
		  class="ending-link"
		  href="你的心得表單網址"
		  target="_blank"
		  rel="noopener">
		  <img src="assets/icon/feedback.png" alt="心得與指教">
		</a>

	  </div>

	</div>
    <script src="game.js"></script>
</body>

</html>
